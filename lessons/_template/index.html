<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}｜因果口袋講義</title>
<link rel="stylesheet" href="../../shared/style.css">
</head>
<body data-code="{{CODE}}" data-title="{{TITLE}}">
<main class="deck">

  <section class="slide" data-type="cover">
    <p class="kicker">{{CODE}} · 入門</p>
    <h1>{{TITLE}}</h1>
    <p class="hook">用一個問題開場。</p>
  </section>

  <section class="slide" data-type="concept">
    <p class="kicker">觀念</p>
    <h2>頁面標題</h2>
    <p>正文不超過 120 字。直覺先於符號。</p>
    <div class="callout note"><b>補充</b>可選的一個提示框。</div>
  </section>

  <section class="slide" data-type="formula">
    <p class="kicker">公式</p>
    <h2>頁面標題</h2>
    <div class="formula">E[Y(1)] − E[Y(0)]</div>
    <p class="plain">公式下一定要有一行白話翻譯。</p>
  </section>

  <section class="slide" data-type="cards">
    <p class="kicker">要點</p>
    <h2>頁面標題</h2>
    <div class="card-row">
      <div class="card"><span class="tag">01</span><h3>要點一</h3><p>每張卡不超過 50 字。</p></div>
      <div class="card"><span class="tag">02</span><h3>要點二</h3><p>每張卡不超過 50 字。</p></div>
      <div class="card"><span class="tag">03</span><h3>要點三</h3><p>每張卡不超過 50 字。</p></div>
    </div>
  </section>

  <section class="slide" data-type="quiz">
    <p class="kicker">小測驗</p>
    <div class="quiz" data-answer="b">
      <p class="q">問題文字？</p>
      <button data-opt="a" data-why="說明為什麼錯。">選項 A</button>
      <button data-opt="b" data-why="說明為什麼對。">選項 B</button>
      <button data-opt="c" data-why="說明為什麼錯。">選項 C</button>
      <p class="quiz-why" aria-live="polite"></p>
    </div>
  </section>

  <section class="slide" data-type="summary">
    <p class="kicker">帶走三句話</p>
    <h2>{{TITLE}}</h2>
    <ol class="takeaways">
      <li>第一句。</li>
      <li>第二句。</li>
      <li>第三句。</li>
    </ol>
    <p class="next">下一份：<a href="../../">講義目錄</a></p>
  </section>

</main>
<script src="../../shared/deck.js"></script>
</body>
</html>
